<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a3b5b" />
    <title>Sin conexión — Florería Bautista</title>
    <!-- Página autocontenida: no depende de ningún archivo externo. -->
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#f0f7ff;color:#1a3b5b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
      main{max-width:26rem}
      h1{font-family:Georgia,"Times New Roman",serif;font-size:1.75rem;margin:0 0 .25rem}
      h1 span{color:#D4AF37}
      h2{font-size:1.125rem;margin:1.5rem 0 .5rem}
      p{margin:0 0 1.5rem;color:#475569;line-height:1.5}
      button,a{display:inline-block;padding:.75rem 1.5rem;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
      button{background:#1a3b5b;color:#fff;border:0}
      a{color:#1a3b5b;margin-left:.5rem}
    </style>
  </head>
  <body>
    <main>
      <h1>Florería <span>Bautista</span></h1>
      <h2>Sin conexión a Internet</h2>
      <p>Esta sección necesita Internet para funcionar. Revisa tu conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="/">Ir a la tienda</a>
    </main>
    <script>
      // En cuanto vuelve la red, se reintenta sin que el usuario tenga que pulsar.
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
